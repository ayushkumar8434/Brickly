<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell</title>
    <link rel="stylesheet" href="./sell.css">
</head>
<body>
    
  <header>
    <h1>Sell Your Home</h1>
  </header>

  <div class="container">
    <h2>Submit Your Property</h2>
    <form>
      <label for="name">Your Name</label>
      <input type="text" id="name" placeholder="Enter your full name">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter your phone number">

      <label for="address">Property Address</label>
      <input type="text" id="address" placeholder="Enter property address">

      <label for="price">Expected Price</label>
      <input type="number" id="price" placeholder="Enter expected price">

      <label for="bedrooms">Bedrooms</label>
      <select id="bedrooms">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4+</option>
      </select>

      <label for="bathrooms">Bathrooms</label>
      <select id="bathrooms">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4+</option>
      </select>

      <label for="description">Property Description</label>
      <textarea id="description" rows="4" placeholder="Add any notes or details about the property"></textarea>

      <button type="submit">Submit Property</button>
    </form>
  </div>


  <script src="./sell.js"></script>
  <script src="sell2.js"></script>
</body>
</html>
