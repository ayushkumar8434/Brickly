<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="./contact.css">
</head>
<body>
    <div class="contact-section" id="contact">
        <h2>Contact Us</h2>
        
        <form class="contact-form">
            
            <input name="text" placeholder="Your Name" class="name" required>
            
            <input type="email" placeholder="Your Email" class="name" required>
            
            <input type="text" placeholder="Address" class="name" required>
            
            <textarea placeholder="requirement" required></textarea>
            
            <button id="btn" type="submit">Submit</button>
        </form>
        
        <script src="contact.js"></script>
        </div>

</body>
</html>
