<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Listings</title>
    <link rel="stylesheet" href="./rent.css">
</head>
<body>
    <header>
    <h1>Rental Listings</h1>
  </header>

  <div class="search-bar">
    <input type="text" placeholder="Search by city, ZIP, or neighborhood">
    <button>Search</button>
  </div>

  <div class="filters">
    <select>
      <option>Price Range</option>
      <option>$500 - $1000</option>
      <option>$1000 - $1500</option>
      <option>$1500+</option>
    </select>
    <select>
      <option>Bedrooms</option>
      <option>1</option>
      <option>2</option>
      <option>3+</option>
    </select>
    <select>
      <option>Bathrooms</option>
      <option>1</option>
      <option>2</option>
      <option>3+</option>
    </select>
  </div>

  <div class="property-grid">
    <div class="property-card">
      <img src="pp1.png" alt="Property Image">
      <div class="property-details">
        <h3>123 Main St, Cityville</h3>
        <p>$1,200 / month</p>
        <p>2 Bed • 1 Bath • 950 sqft</p>
      </div>
    </div>

    <div class="property-card">
      <img src="pp2.png" alt="Property Image">
      <div class="property-details">
        <h3>456 Oak Ave, Townsville</h3>
        <p>$1,500 / month</p>
        <p>3 Bed • 2 Bath • 1,200 sqft</p>
      </div>
    </div>

    <div class="property-card">
      <img src="pp3.png" alt="Property Image">
      <div class="property-details">
        <h3>789 Pine Rd, Villageburg</h3>
        <p>$1,000 / month</p>
        <p>1 Bed • 1 Bath • 800 sqft</p>
      </div>
    </div>
  </div>
</body>
</html>
