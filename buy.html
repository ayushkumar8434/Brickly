<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy</title>
    <link rel="stylesheet" href="./buy.css">
</head>
<body>
    <header>
    <h1>Buy a Home</h1>
  </header>

  <div class="search-bar">
    <input type="text" placeholder="City, ZIP, or Neighborhood">
    <select>
      <option>Price Range</option>
      <option>$100k - $300k</option>
      <option>$300k - $500k</option>
      <option>$500k+</option>
    </select>
    <select>
      <option>Bedrooms</option>
      <option>1</option>
      <option>2</option>
      <option>3+</option>
    </select>
    <button>Search</button>
  </div>

  <div class="property-grid">
    <div class="property-card">
      <img src="buy1.png" alt="Property Image">
      <div class="property-details">
        <h3>123 Lemon St, Citrusville</h3>
        <p>$250,000</p>
        <p>2 Bed • 1 Bath • 950 sqft</p>
      </div>
    </div>

    <div class="property-card">
      <img src="buy2.png" alt="Property Image">
      <div class="property-details">
        <h3>456 Sunshine Ave, Lemonville</h3>
        <p>$350,000</p>
        <p>3 Bed • 2 Bath • 1,200 sqft</p>
      </div>
    </div>

    <div class="property-card">
      <img src="buy3.png" alt="Property Image">
      <div class="property-details">
        <h3>789 Citrus Rd, Lemon City</h3>
        <p>$500,000</p>
        <p>4 Bed • 3 Bath • 2,000 sqft</p>
      </div>
    </div>
  </div>
</body>
</html>
